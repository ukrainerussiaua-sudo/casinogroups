<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Игровой стол</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg:#0b1f18;--felt:#14402f;--felt2:#1d6048;--ivory:#f6f0e0;--ink:#1c1a17;--red:#c43a2f;--brass:#e2bb68;--brass2:#b8903f;--muted:#8db3a3;--line:rgba(246,240,224,.13);--serif:Palatino,"Palatino Linotype","Iowan Old Style",Georgia,serif}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);color:var(--ivory);overscroll-behavior:none}
body{font:15px/1.35 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh;background:radial-gradient(120% 70% at 50% -10%,#18493a,var(--bg) 65%);padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);overflow-x:hidden}
button{font:inherit;color:inherit;border:0;cursor:pointer}
.top{display:flex;align-items:center;justify-content:space-between;padding:12px 16px}
.brand{display:flex;align-items:center;gap:10px}.brand h1{font:700 20px var(--serif)}
.glyph{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;background:linear-gradient(#f0cd82,#b8903f);color:#2a1d07;font-size:17px}
.chip{display:inline-block;padding:3px 10px;border-radius:99px;background:rgba(246,240,224,.1);border:1px solid var(--line);font-size:12px;margin-left:6px}
.chip.on{background:var(--brass);color:var(--ink);border-color:var(--brass);font-weight:700}
main{padding:4px 12px 32px;max-width:520px;margin:0 auto}
.stack>*+*{margin-top:12px}
.row{display:flex;align-items:center}.between{justify-content:space-between}.gap{gap:10px}
.dim{color:var(--muted);font-size:13px}.say{text-align:center}
.status{text-align:center;font:600 15px var(--serif);min-height:22px}
.banner{background:linear-gradient(#f0cd82,#cfa24d);color:#2a1d07;padding:11px 12px;border-radius:12px;font-weight:700;text-align:center}
.tag{font-size:12px;color:var(--brass)}
/* ── cards ── */
.c{--cw:56px;width:var(--cw);height:calc(var(--cw)*1.42);border-radius:calc(var(--cw)*.13);background:linear-gradient(160deg,#fffaf0,#ece2c8);color:var(--ink);position:relative;flex:none;font-family:var(--serif);font-weight:700;box-shadow:0 1px 1px rgba(0,0,0,.55),0 6px 14px rgba(0,0,0,.38);transform:rotate(var(--r,0deg)) translateY(var(--y,0px));transform-origin:50% 130%;user-select:none}
.c.sm{--cw:40px}.c.xs{--cw:26px}.c.md{--cw:48px}
.c .tl,.c .br{position:absolute;display:flex;flex-direction:column;align-items:center;line-height:.95;font-size:calc(var(--cw)*.3)}
.c .tl{left:calc(var(--cw)*.09);top:calc(var(--cw)*.06)}.c .br{right:calc(var(--cw)*.09);bottom:calc(var(--cw)*.06);transform:rotate(180deg)}
.c i{font-style:normal}.c .mid{position:absolute;inset:0;display:grid;place-items:center;font-size:calc(var(--cw)*.56);opacity:.9}
.c.r{color:var(--red)}
.c.back{background:repeating-linear-gradient(45deg,#2b6b53 0 3px,#1f5440 3px 6px);box-shadow:inset 0 0 0 calc(var(--cw)*.05) var(--ivory),inset 0 0 0 calc(var(--cw)*.09) #1f5440,0 1px 1px rgba(0,0,0,.55),0 6px 14px rgba(0,0,0,.38)}
.c.ok{box-shadow:0 0 0 2px var(--brass),0 8px 20px rgba(226,187,104,.4);cursor:pointer}
.c.no{filter:brightness(.72) saturate(.7)}
.c.ok:active{transform:rotate(var(--r,0deg)) translateY(calc(var(--y,0px) - 14px))}
.fan{display:flex;justify-content:center;padding:6px 0 4px}.fan .c+.c{margin-left:calc(var(--ov,0px)*-1)}
.fan.big{padding-top:26px}
.pile{position:relative;width:62px;height:72px}.pile .c{position:absolute;left:0;top:0}
.pile .trump{left:10px;top:12px}.pile small{position:absolute;left:0;right:0;bottom:-16px;text-align:center;font-size:11px;color:var(--muted)}
/* ── surfaces ── */
.table{background:radial-gradient(ellipse at 50% 35%,var(--felt2),var(--felt) 72%);border:1px solid rgba(226,187,104,.28);border-radius:22px;padding:14px;box-shadow:inset 0 8px 30px rgba(0,0,0,.35),0 8px 24px rgba(0,0,0,.3)}
.dtable{display:grid;grid-template-columns:70px 1fr;gap:10px;min-height:196px}
.piles{display:flex;flex-direction:column;justify-content:space-between;align-items:center;padding:4px 0 22px;gap:30px}
.board{display:flex;flex-wrap:wrap;gap:10px 6px;justify-content:center;align-content:center}
.pair{position:relative;width:calc(56px + 22px);height:calc(56px*1.42 + 14px);margin:2px;transform:rotate(var(--pr,0deg))}
.pair .c:first-child{position:absolute;left:0;bottom:0}.pair .c+.c{position:absolute;left:20px;top:0;box-shadow:-3px 4px 10px rgba(0,0,0,.45)}
.oval{background:radial-gradient(ellipse at 50% 35%,var(--felt2),var(--felt) 72%);border:7px solid #2d1f13;outline:2px solid var(--brass2);border-radius:90px;padding:18px 14px;display:grid;gap:12px;justify-items:center;box-shadow:inset 0 8px 30px rgba(0,0,0,.45),0 10px 24px rgba(0,0,0,.35);position:relative}
.bd{display:flex;gap:6px}.c.empty{background:transparent;border:1px dashed rgba(246,240,224,.25);box-shadow:none}
.pot{display:inline-flex;align-items:center;gap:8px;padding:5px 14px;border-radius:99px;background:rgba(0,0,0,.35);font:700 15px var(--serif)}
.coin{width:18px;height:18px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#f6dfa6,#b8903f);box-shadow:inset 0 0 0 3px rgba(255,255,255,.35)}
.oval .pile{position:absolute;right:20px;bottom:12px;transform:scale(.55);transform-origin:right bottom}.oval .pile small{display:none}
.dealer{display:grid;justify-items:center;gap:4px}
/* ── seats ── */
.av{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font:700 15px var(--serif);background:var(--ac,#35705a);color:#fff;border:2px solid rgba(255,255,255,.28);flex:none}
.opps{display:flex;gap:8px;overflow-x:auto;padding:2px}
.opp{flex:1;min-width:112px;position:relative;background:rgba(0,0,0,.24);border:1px solid var(--line);border-radius:16px;padding:8px;display:grid;grid-template-columns:auto 1fr;gap:2px 8px;align-items:center}
.opp .mini{grid-column:1/-1;display:flex;justify-content:center;min-height:52px;padding-top:6px}
.opp .cnt{position:absolute;right:8px;top:6px;font-size:12px;color:var(--muted)}
.opp.att,.seat.turn{border-color:var(--brass);box-shadow:0 0 0 1px var(--brass),0 0 18px rgba(226,187,104,.25)}
.opp.def{border-color:#6fb4d8}.opp.out,.seat.out{opacity:.45}
.seat{background:rgba(0,0,0,.24);border:1px solid var(--line);border-radius:16px;padding:9px 10px;display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:center}
.seat .cards{grid-column:1/-1;display:flex;justify-content:flex-start;min-height:44px}
.seat b{font-weight:650}
.badge{display:inline-grid;place-items:center;min-width:26px;height:26px;padding:0 7px;border-radius:99px;background:rgba(0,0,0,.4);font:700 13px var(--serif)}
.badge.g{background:var(--brass);color:var(--ink)}.badge.bad{background:#7d2620}.badge.win{background:#2f7d4f}
.betchip{display:inline-flex;align-items:center;gap:5px;font:700 13px var(--serif);color:var(--brass)}.betchip .coin{width:14px;height:14px}
/* ── controls ── */
.btns{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.btn{padding:12px 22px;border-radius:99px;background:rgba(246,240,224,.1);border:1px solid var(--line);font-weight:650;min-width:92px;transition:transform .1s}
.btn.main{background:linear-gradient(#f0cd82,#cfa24d);color:#2a1d07;border-color:#f6dfa6}
.btn.warn{background:linear-gradient(#a8392f,#7d2620);border-color:#c8574d}.btn:active{transform:scale(.95)}
.panel{background:rgba(0,0,0,.24);border:1px solid var(--line);border-radius:16px;padding:12px}
input[type=range]{width:100%;accent-color:var(--brass)}
.toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom));transform:translateX(-50%);background:rgba(0,0,0,.85);border:1px solid var(--line);padding:9px 15px;border-radius:12px;z-index:90;max-width:90%}
.msg{text-align:center;padding:70px 20px;color:var(--muted)}
/* ── tetris ── */
.tt{display:flex;gap:12px;justify-content:center;align-items:flex-start}
canvas{background:#08150f;border:2px solid #2d1f13;outline:1px solid var(--brass2);border-radius:8px;display:block}
.opps2{display:flex;flex-direction:column;gap:10px;align-items:center}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px;justify-items:center}
.pad{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:12px;touch-action:none}
.pad button{height:54px;border-radius:16px;background:rgba(246,240,224,.1);border:1px solid var(--line);font-size:20px;user-select:none;touch-action:none}
/* ── профиль ── */
.pbtn{cursor:pointer;font-weight:700;color:var(--brass)}
.sheet{position:fixed;inset:0;z-index:80;overflow-y:auto;background:radial-gradient(120% 70% at 50% -10%,#18493a,var(--bg) 65%);padding:env(safe-area-inset-top) 0 calc(24px + env(safe-area-inset-bottom))}
.sheet .head{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;position:sticky;top:0;background:rgba(11,31,24,.92);z-index:2}
.sheet h2{font:700 20px var(--serif)}
.sheet .btn{min-width:0;padding:7px 14px}
.hero{display:grid;justify-items:center;gap:6px;padding:18px 14px 16px;border-radius:22px;background:radial-gradient(ellipse at 50% 0%,var(--felt2),var(--felt) 75%);border:1px solid rgba(226,187,104,.28);box-shadow:inset 0 8px 30px rgba(0,0,0,.35)}
.av.big{width:64px;height:64px;font-size:28px;border-width:3px}
.hname{font:700 20px var(--serif)}
.rankpill{padding:4px 14px;border-radius:99px;background:linear-gradient(#f0cd82,#cfa24d);color:#2a1d07;font-weight:700}
.pts b{font:700 38px var(--serif);color:var(--brass)}
.bar{width:100%;height:10px;border-radius:99px;background:rgba(0,0,0,.4);overflow:hidden}.bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#f0cd82,#b8903f)}
.stats4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.st{background:rgba(0,0,0,.24);border:1px solid var(--line);border-radius:14px;padding:10px 2px;text-align:center}.st b{display:block;font:700 22px var(--serif)}.st span{font-size:11px;color:var(--muted)}
.grow{display:grid;grid-template-columns:1fr auto;gap:4px 10px;align-items:center}.grow .bar{grid-column:1/-1;height:6px}
.dots{display:flex;gap:6px;justify-content:center;font-size:16px}
.badges{display:flex;flex-wrap:wrap;gap:6px}.badges .chip{margin:0;font-size:13px}
.ladder{display:flex;flex-wrap:wrap;gap:6px}.ladder .chip{margin:0;opacity:.55}.ladder .chip.cur{opacity:1;background:var(--brass);color:var(--ink);border-color:var(--brass);font-weight:700}
.lb{display:grid;grid-template-columns:30px 1fr auto;gap:8px;align-items:center;padding:7px 8px;border-radius:12px}.lb.me{background:rgba(226,187,104,.16);outline:1px solid var(--brass)}
.lb .pos{text-align:center;font:700 15px var(--serif)}
.h3{font:700 16px var(--serif);margin:2px 2px -4px}
b.up{color:#7be0a0}b.dn{color:#ff8d84}
.rules{font-size:12.5px;color:var(--muted);display:grid;gap:4px}
/* ── demo bar ── */
.demo{display:none;gap:6px;flex-wrap:wrap;justify-content:center;padding:8px 12px;border-bottom:1px solid var(--line);background:rgba(0,0,0,.25)}
.demo button{padding:7px 13px;border-radius:99px;background:rgba(246,240,224,.1);font-size:14px}.demo button.on{background:var(--brass);color:var(--ink);font-weight:700}
.note{display:none;font-size:12px;color:var(--muted);text-align:center;padding:8px 16px 0}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="top"><div class="brand"><div class="glyph" id="glyph">♠</div><h1 id="title">Игровой стол</h1></div><div id="meta"></div></div>
<div class="demo" id="demo"></div><div class="note" id="note">Демо: так выглядит Mini App внутри Telegram. Боты ходят сами, в дураке можно реально играть.</div>
<main id="main"><div class="msg">Подключаюсь…</div></main>
<script>
"use strict";
const tg = window.Telegram?.WebApp;
try { tg.ready(); tg.expand(); tg.setHeaderColor('#0b1f18'); tg.setBackgroundColor('#0b1f18'); tg.disableVerticalSwipes?.(); } catch (e) {}
const qs = new URLSearchParams(location.search);
const START = tg?.initDataUnsafe?.start_param || qs.get('lobby') || '';
const LOBBY = ['me', 'profile'].includes(START) ? '' : START;  // startapp=me — кнопка «Открыть профиль», это не игра
const DEV = qs.get('dev') === '1';
const DEMO = !tg?.initData && !DEV;
const PONLY = !LOBBY && !DEMO;  // открыто без игры (кнопка «Открыть профиль» из чата)
const SUIT = {S:'♠',H:'♥',D:'♦',C:'♣'};
const TITLES = {durak:'Дурак', blackjack:'Блэкджек', poker:'Покер', tetris:'Тетрис'};
const GLYPH = {durak:'♠', blackjack:'♣', poker:'♦', tetris:'▦'};
const $ = s => document.querySelector(s);
let ws, S = null, prevS = null, retry = 0, fatalShown = false;
const UI = {raise: null};

function h(tag, props, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(props || {})) {
    if (k === 'class') e.className = v;
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else if (v !== false && v != null) e.setAttribute(k, v === true ? '' : v);
  }
  for (const k of kids.flat(3)) if (k != null && k !== false) e.append(k.nodeType ? k : document.createTextNode(k));
  return e;
}
const nm = id => (S.names[id] || '?');
const send = o => ws && ws.readyState === 1 && ws.send(JSON.stringify(o));
const act = o => { try { tg.HapticFeedback?.impactOccurred('light'); } catch (e) {} if (DEMO) return demoAct(o); send({t: 'act', ...o}); };
function toast(t) { const e = h('div', {class: 'toast'}, t); document.body.append(e); setTimeout(() => e.remove(), 2200); }

// ───────── cards ─────────
function card(c, o = {}) {
  const s = c ? c.slice(-1) : '', r = c ? c.slice(0, -1) : '';
  const e = h('div', {class: `c ${c ? (s === 'H' || s === 'D' ? 'r' : '') : 'back'} ${o.cls || ''}`, onclick: o.onclick});
  if (c) { const g = SUIT[s]; e.append(h('b', {class: 'tl'}, h('span', {}, r), h('i', {}, g)), h('i', {class: 'mid'}, g), h('b', {class: 'br'}, h('span', {}, r), h('i', {}, g))); }
  if (o.k) { e.dataset.k = o.k; e.dataset.f = c || 'back'; }
  if (o.src) e.dataset.src = o.src;
  if (o.r != null) e.style.setProperty('--r', o.r + 'deg');
  if (o.y != null) e.style.setProperty('--y', o.y + 'px');
  return e;
}
// веер: карты перекрывают друг друга и чуть повёрнуты по дуге
function fan(cards, mk, cw = 56, avail = Math.min(innerWidth, 520) - 44, cls = '') {
  const n = cards.length, mid = (n - 1) / 2, step = Math.min(5, 24 / Math.max(n, 1));
  const ov = n > 1 ? Math.max(cw * .3, (n * cw - avail) / (n - 1)) : 0;
  const box = h('div', {class: 'fan ' + cls, style: `--ov:${ov}px`});
  cards.forEach((c, i) => { const d = i - mid; box.append(mk(c, i, {r: +(d * step).toFixed(1), y: +(d * d * (step > 3 ? 1.5 : 1)).toFixed(1)})); });
  return box;
}
const avatar = id => h('div', {class: 'av', style: `--ac:hsl(${(id * 67) % 360} 42% 36%)`}, (nm(id) || '?')[0].toUpperCase());

// ───────── FLIP-анимации: карты летят между рендерами ─────────
const REDUCED = matchMedia('(prefers-reduced-motion:reduce)').matches;
function snap() { const m = new Map(); document.querySelectorAll('[data-k]').forEach(e => m.set(e.dataset.k, {r: e.getBoundingClientRect(), n: e.cloneNode(true), f: e.dataset.f})); return m; }
function fx(before, dest) {
  if (REDUCED) return;
  const A = id => document.querySelector(`[data-a="${id}"]`);
  let i = 0, j = 0;
  document.querySelectorAll('[data-k]').forEach(el => {
    const o = before.get(el.dataset.k); let from = o && o.r;
    if (!o && el.dataset.src) { const a = A(el.dataset.src); if (a) from = a.getBoundingClientRect(); }
    if (!from) return;
    const to = el.getBoundingClientRect(), end = getComputedStyle(el).transform, e0 = end === 'none' ? '' : end;
    if (o && o.f !== el.dataset.f) { el.animate([{transform: e0 + ' scaleX(.05)'}, {transform: e0 || 'none'}], {duration: 320, easing: 'ease-out'}); return; }
    const dx = from.left - to.left + (o ? 0 : (from.width - to.width) / 2), dy = from.top - to.top + (o ? 0 : (from.height - to.height) / 2);
    if (Math.abs(dx) + Math.abs(dy) < 3) return;
    el.animate([{transform: `translate(${dx}px,${dy}px) ${o ? '' : 'scale(.6)'} ${e0}`, opacity: o ? 1 : .2}, {transform: e0 || 'none', opacity: 1}],
      {duration: 420, delay: i++ * 55, easing: 'cubic-bezier(.2,.8,.2,1)', fill: 'backwards'});
  });
  before.forEach((o, k) => {
    if (document.querySelector(`[data-k="${CSS.escape(k)}"]`)) return;
    const a = dest && A(dest); if (!a) return;
    const g = o.n; g.style.cssText = `position:fixed;left:${o.r.left}px;top:${o.r.top}px;margin:0;z-index:60;pointer-events:none`;
    document.body.append(g);
    const t = a.getBoundingClientRect(), st = getComputedStyle(g).transform;
    const dx = t.left + t.width / 2 - (o.r.left + o.r.width / 2), dy = t.top + t.height / 2 - (o.r.top + o.r.height / 2);
    g.animate([{transform: st, opacity: 1}, {transform: `translate(${dx}px,${dy}px) rotate(${20 + j * 7}deg) scale(.55)`, opacity: .1}],
      {duration: 520, delay: j++ * 60, easing: 'cubic-bezier(.55,0,.85,.4)', fill: 'forwards'}).onfinish = () => g.remove();
  });
}
function destFor(p, s) {
  if (s.game === 'durak' && p.view && s.view) return s.view.discard > p.view.discard ? 'discard' : 'seat-' + p.view.defender;
  return 'deck';
}

// ───────── Профиль ─────────
let PD = null, SHEET = false;
function renderMeta() {
  const k = [];
  if (S) k.push(h('span', {class: 'chip on'}, S.role === 'player' ? 'Игрок' : 'Зритель'), h('span', {class: 'chip'}, '👁 ' + S.viewers));
  if (PD && !PONLY) k.push(h('button', {class: 'chip pbtn', onclick: openSheet}, `${PD.p.rank.emoji} ${PD.p.points} ⭐`));
  $('#meta').replaceChildren(...k);
}
function openSheet() { SHEET = true; if (DEMO) PD = demoProfileMsg(); else send({t: 'profile'}); drawSheet(); }
function drawSheet() {
  let el = $('#sheet');
  if (!SHEET) { el && el.remove(); return; }
  if (!el) { el = h('div', {class: 'sheet', id: 'sheet'}); document.body.append(el); }
  el.replaceChildren(h('div', {class: 'head'}, h('h2', {}, '👤 Профиль'), h('button', {class: 'btn', onclick: () => { SHEET = false; drawSheet(); }}, '✕')),
    h('main', {}, PD ? profileNode(PD) : h('div', {class: 'msg'}, 'Загружаю…')));
}
function renderProfileOnly() { $('#title').textContent = 'Профиль'; $('#glyph').textContent = '👤'; $('#main').replaceChildren(profileNode(PD)); }
function rewardsPanel(R) {
  return h('div', {class: 'panel stack'}, h('div', {class: 'tag say'}, '⭐ Очки за партию'), Object.entries(R).map(([id, r]) =>
    h('div', {class: 'row between'}, h('span', {}, (r.result === 'w' ? '🏆 ' : r.result === 'l' ? '💀 ' : '🤝 ') + nm(+id) + (+id === S.me ? ' · ты' : '')),
      h('span', {}, h('b', {class: r.delta > 0 ? 'up' : r.delta < 0 ? 'dn' : ''}, (r.delta > 0 ? '+' : '') + r.delta), ` → ${r.points} ${r.rank.emoji}`, r.up ? ' 🎉 новое звание!' : ''))));
}
function profileNode(D) {
  const p = D.p, r = p.rank, G = D.games || {}, box = h('div', {class: 'stack'});
  box.append(h('div', {class: 'hero'},
    h('div', {class: 'av big', style: `--ac:hsl(${(p.uid * 67) % 360} 42% 36%)`}, (p.name || '?')[0].toUpperCase()),
    h('div', {class: 'hname'}, p.name), h('div', {class: 'rankpill'}, `${r.emoji} ${r.name}`),
    h('div', {class: 'pts'}, h('b', {}, p.points), ' ⭐'),
